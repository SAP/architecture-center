name: Find Unreferenced Files

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-unused-files:
    name: Find Unreferenced Files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Find unreferenced files and write to summary
        shell: bash
        run: |
          echo "### Unreferenced Files Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          FILE_DIRS=("assets" "diagrams" "docs")  # update as needed
          FILE_EXTENSIONS=("*.png" "*.jpg" "*.jpeg" "*.svg" "*.drawio" "*.docx")  # update as needed
          mapfile -t MARKDOWN_FILES < <(find . -name "*.md")

          FOUND_UNUSED=0

          for dir in "${FILE_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              for ext in "${FILE_EXTENSIONS[@]}"; do
                while read -r file; do
                  [ -z "$file" ] && continue
                  basename=$(basename "$file")
                  # Single fixed-string grep across all markdown at once (-q stops at
                  # first match); guard the empty list so grep never blocks on stdin.
                  if [ "${#MARKDOWN_FILES[@]}" -gt 0 ] && grep -qF -- "$basename" "${MARKDOWN_FILES[@]}" 2>/dev/null; then
                    referenced=true
                  else
                    referenced=false
                  fi

                  if [ "$referenced" = false ]; then
                    echo "- $file" >> "$GITHUB_STEP_SUMMARY"
                    FOUND_UNUSED=1
                  fi
                done < <(find "$dir" -type f -name "$ext")
              done
            fi
          done

          if [ "$FOUND_UNUSED" -eq 0 ]; then
            echo "✅ No unreferenced files found." >> "$GITHUB_STEP_SUMMARY"
          fi
