name: Check SEO Front Matter
# Archetype: CHANGED-FILES — only changed docs Markdown is checked (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-seo-frontmatter.js'
      - '.github/workflows/check-seo-frontmatter.yml'
      - '.github/actions/changed-files/action.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-seo-frontmatter.js'
      - '.github/workflows/check-seo-frontmatter.yml'
      - '.github/actions/changed-files/action.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-seo-frontmatter:
    name: Check SEO Front Matter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed to diff changed Markdown against the PR base

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts # fork PR controls the lockfile; don't run dependency lifecycle scripts

      # Scope to the Markdown changed on this PR / push to dev (shared logic).
      - name: Collect changed files
        id: changed
        uses: ./.github/actions/changed-files
        with:
          pathspec: docs
          filter-regex: '\.(md|mdx)$'

      - name: Check title and description lengths
        shell: bash
        run: |
          FILES=()
          if [ "${{ steps.changed.outputs.any }}" = "true" ]; then
            mapfile -d '' -t FILES < "${{ steps.changed.outputs.files-file }}"
          fi
          node src/_scripts/_check-seo-frontmatter.js "${FILES[@]}"
