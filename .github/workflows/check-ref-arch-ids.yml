name: Check Reference Architecture IDs
# Archetype: CHANGED-FILES — only changed readme.md fail, but ALL readmes are read to validate global id/slug uniqueness (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'docs/ref-arch/**/readme.md'
      - 'src/_scripts/_check-ids.zsh'
      - '.github/workflows/check-ref-arch-ids.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ref-arch-ids:
    name: Check Reference Architecture IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed to diff changed readme.md against the PR base

      - name: Install zsh
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check reference architecture IDs and slugs
        shell: bash
        run: |
          # Changed-files scope: only changed readme.md fail the check. The script
          # still reads EVERY readme to validate global id/slug uniqueness, then
          # reports only collisions/errors that involve a changed file.
          git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD" -- docs/ref-arch \
            | grep -E '/readme\.md$' > "$RUNNER_TEMP/changed.txt" || true
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            {
              echo "### Reference architecture ID check"
              echo ""
              echo "✅ No changed ref-arch readme.md — nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "✅ No changed ref-arch readme.md — nothing to check."
            exit 0
          fi
          mapfile -t FILES < "$RUNNER_TEMP/changed.txt"
          zsh src/_scripts/_check-ids.zsh "${FILES[@]}"
