name: Check Reference Architecture IDs
# Archetype: CHANGED-FILES — only changed readme.md (vs the PR base, or vs the
# previous commit on a push to dev) fail, but ALL readmes are read to validate
# global id/slug uniqueness (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/ref-arch/**/readme.md'
      - 'src/_scripts/_check-ids.zsh'
      - '.github/workflows/check-ref-arch-ids.yml'
      - '.github/actions/changed-files/action.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/ref-arch/**/readme.md'
      - 'src/_scripts/_check-ids.zsh'
      - '.github/workflows/check-ref-arch-ids.yml'
      - '.github/actions/changed-files/action.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-ref-arch-ids:
    name: Check Reference Architecture IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed to diff changed readme.md against the PR base / previous commit

      - name: Install zsh
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh

      # Scope to the changed ref-arch readme.md on this PR / push to dev (shared logic).
      - name: Collect changed files
        id: changed
        uses: ./.github/actions/changed-files
        with:
          pathspec: docs/ref-arch
          filter-regex: '/readme\.md$'

      - name: Check reference architecture IDs and slugs
        shell: bash
        run: |
          # Changed-files scope: only changed readme.md fail the check. The script
          # still reads EVERY readme to validate global id/slug uniqueness, then
          # reports only collisions/errors that involve a changed file.
          FILES=()
          if [ "${{ steps.changed.outputs.any }}" = "true" ]; then
            mapfile -d '' -t FILES < "${{ steps.changed.outputs.files-file }}"
            zsh src/_scripts/_check-ids.zsh "${FILES[@]}"
          else
            {
              echo "### Reference architecture ID check"
              echo ""
              echo "✅ No changed ref-arch readme.md — nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "✅ No changed ref-arch readme.md — nothing to check."
          fi
