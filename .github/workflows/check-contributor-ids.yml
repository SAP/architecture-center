name: Check Contributor IDs
# Archetype: CHANGED-FILES — only Markdown added/modified vs the base (on a PR) or
# vs the previous commit (on a push to dev) is checked (needs fetch-depth: 0).
#
# Fails when a changed docs page credits an SAP internal user ID (an I-, D-, or C-number
# such as I057866) as its last_update.author or in its contributors list. Contributors
# must be credited by their public GitHub username, never by an internal user ID.

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-contributor-ids.js'
      - '.github/actions/changed-files/action.yml'
      - '.github/workflows/check-contributor-ids.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-contributor-ids.js'
      - '.github/actions/changed-files/action.yml'
      - '.github/workflows/check-contributor-ids.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-contributor-ids:
    name: Check Contributor IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need history to diff the PR base / previous commit
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts # fork PR controls the lockfile; don't run dependency lifecycle scripts

      # Scope to the Markdown changed on this PR / push to dev (shared logic).
      - name: Collect changed files
        id: changed
        uses: ./.github/actions/changed-files
        with:
          pathspec: docs
          filter-regex: '\.(md|mdx)$'

      # Emits GitHub error annotations on the offending front matter line and a job
      # summary. Exits non-zero when any internal user ID is found, so the check FAILS.
      - name: Check contributor IDs
        shell: bash
        run: |
          FILES=()
          if [ "${{ steps.changed.outputs.any }}" = "true" ]; then
            mapfile -d '' -t FILES < "${{ steps.changed.outputs.files-file }}"
          fi
          node src/_scripts/_check-contributor-ids.js "${FILES[@]}"
