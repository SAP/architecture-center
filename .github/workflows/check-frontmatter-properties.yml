name: Check Front Matter Properties

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-frontmatter-properties.js'
      - '.github/workflows/check-frontmatter-properties.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontmatter-properties:
    name: Check Front Matter Properties
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the base commit to diff the PR's changed files
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts # fork PR controls the lockfile; don't run dependency lifecycle scripts

      - name: Stamp today's date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      # Annotations + job summary. Findings surface in the aggregated PR comment
      # (check-pr-comment.yml) via this check's error annotations.
      # Exits non-zero when any issue is found, so this check FAILS the PR.
      - name: Check front matter properties
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_DIR: ${{ runner.temp }}/fm-comment
        run: node src/_scripts/_check-frontmatter-properties.js

      # NOTE: kept until the consolidation lands on the default branch. The sticky
      # commenter (comment-frontmatter-properties.yml) still runs from `dev` on
      # workflow_run and downloads this artifact; removing it here made that
      # dev-side job fail. Once this PR merges (commenter deleted, findings folded
      # into check-pr-comment.yml) this upload becomes unused and can be removed.
      - name: Upload comment artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontmatter-comment
          path: ${{ runner.temp }}/fm-comment
          if-no-files-found: error
          retention-days: 1
