name: Check Front Matter Properties

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-frontmatter-properties.js'
      - '.github/workflows/check-frontmatter-properties.yml'
      - '.github/actions/changed-files/action.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-frontmatter-properties.js'
      - '.github/workflows/check-frontmatter-properties.yml'
      - '.github/actions/changed-files/action.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-frontmatter-properties:
    name: Check Front Matter Properties
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the base commit to diff the PR's changed files
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts # fork PR controls the lockfile; don't run dependency lifecycle scripts

      - name: Stamp today's date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      # Scope to the Markdown changed on this PR / push to dev (shared logic).
      - name: Collect changed files
        id: changed
        uses: ./.github/actions/changed-files
        with:
          pathspec: docs
          filter-regex: '\.(md|mdx)$'

      # Annotations + job summary. Findings surface in the aggregated PR comment
      # (check-pr-comment.yml) via this check's error annotations.
      # Exits non-zero when any issue is found, so this check FAILS the PR.
      - name: Check front matter properties
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          FILES=()
          if [ "${{ steps.changed.outputs.any }}" = "true" ]; then
            mapfile -d '' -t FILES < "${{ steps.changed.outputs.files-file }}"
          fi
          node src/_scripts/_check-frontmatter-properties.js "${FILES[@]}"
