name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '43 2 * * 6'
  push:
    branches: [dev]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: [ self-hosted, solinas ]
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3 (last GHES-compatible major; v4+ uses @actions/artifact v2, unsupported on GHES)
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code-scanning dashboard
        uses: github/codeql-action/upload-sarif@6f240a501577534ef178b856f0493fc6ee43280c # v4 (github.tools.sap internal mirror SHA; not on github.com)
        with:
          sarif_file: results.sarif
