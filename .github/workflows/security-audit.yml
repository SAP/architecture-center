name: Security Audit

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  audit-scripts:
    name: Audit npm Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check for dangerous npm lifecycle scripts
        shell: bash
        run: |
          [ -f package.json ] || { echo "package.json not found, skipping."; exit 0; }
          echo "🔍 Checking package.json for suspicious scripts..."

          DANGEROUS_HOOKS=(
            preinstall install postinstall
            preuninstall uninstall postuninstall
            prepublish publish postpublish
            preprepare prepare postprepare
            prepack pack postpack
            preversion version postversion
            pretest test posttest
            prestart start poststart
            prestop stop poststop
            prerestart restart postrestart
          )

          FOUND_ISSUES=0

          for hook in "${DANGEROUS_HOOKS[@]}"; do
            if jq -e --arg h "$hook" '.scripts[$h]' package.json > /dev/null 2>&1; then
              SCRIPT_VALUE=$(jq -r --arg h "$hook" '.scripts[$h]' package.json)
              echo "⚠️  ALERT: Found lifecycle script '$hook': $SCRIPT_VALUE"

              if echo "$SCRIPT_VALUE" | grep -qE '(curl|wget|bash|\bsh\b|\bnc\b|/dev/tcp|eval|base64)'; then
                echo "🚨 CRITICAL: Script '$hook' contains potentially dangerous commands!"
                FOUND_ISSUES=1
              fi
            fi
          done

          # Check for scripts that reference external shell files
          if jq -r '.scripts | to_entries[] | .value' package.json | grep -qE '\.(sh|bash|ps1)'; then
            echo "⚠️  WARNING: Some scripts reference shell script files. Please review them manually."
          fi

          if [ "$FOUND_ISSUES" -eq 1 ]; then
            echo ""
            echo "❌ Security audit failed! Please review the flagged scripts."
            exit 1
          else
            echo "✅ No critical issues found in npm scripts."
          fi

      - name: Check for suspicious patterns in scripts
        shell: bash
        run: |
          [ -f package.json ] || { echo "package.json not found, skipping."; exit 0; }
          echo "🔍 Scanning all scripts for suspicious patterns..."

          SUSPICIOUS_PATTERNS=(
            "curl.*\|.*sh"
            "wget.*\|.*sh"
            "wget.*\|.*bash"
            "base64.*-d"
            "/dev/tcp"
            "nc -e"
            "\beval\b"               # intentionally broad — eval in npm scripts is rarely legitimate; review any match
            '\$\(curl'
            '\$\(wget'
            "node\s+(-e|--eval)"
            "python[0-9]?.*-c"
            "perl.*-e"
            "ruby.*-e"
            "php.*-r"
            "railway.app"
            "ngrok"
            "pipedream"
            "requestbin"
            "webhook.site"
          )

          FOUND=0
          for pattern in "${SUSPICIOUS_PATTERNS[@]}"; do
            MATCH=$(jq -r '.scripts | to_entries[] | "\(.key): \(.value)"' package.json | grep -iE "$pattern" | head -3 || true)
            if [ -n "$MATCH" ]; then
              echo "🚨 CRITICAL: Pattern '$pattern' matched:"
              echo "   $MATCH"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi

          echo "✅ No suspicious patterns detected."

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'

      - name: Generate npm audit SARIF
        shell: bash
        run: |
          [ -f package-lock.json ] || { echo "No package-lock.json, skipping SARIF."; exit 0; }
          npm audit --json > npm-audit.json 2>&1 || true
          cat > /tmp/audit-to-sarif.js << 'JSEOF'
          const fs = require('fs');
          let audit;
          try { audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8')); } catch (e) { audit = { vulnerabilities: {} }; }
          const vulns = Object.entries(audit.vulnerabilities || {});
          const levelMap = { critical: 'error', high: 'error', moderate: 'warning', low: 'note', info: 'note' };
          const sarif = {
            '$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
            version: '2.1.0',
            runs: [{
              tool: { driver: { name: 'npm-audit', version: '1.0.0', informationUri: 'https://docs.npmjs.com/cli/audit',
                rules: vulns.map(([id, v]) => ({ id, shortDescription: { text: v.severity + ' vulnerability in ' + id }, properties: { severity: v.severity } }))
              }},
              results: vulns.map(([id, v]) => ({
                ruleId: id,
                level: levelMap[v.severity] || 'warning',
                message: { text: 'Vulnerable package: ' + id + ' (' + v.severity + ')' },
                locations: [{ physicalLocation: { artifactLocation: { uri: 'package-lock.json', uriBaseId: '%SRCROOT%' }, region: { startLine: 1 } } }]
              }))
            }]
          };
          fs.writeFileSync('npm-audit.sarif', JSON.stringify(sarif, null, 2));
          console.log('SARIF generated: ' + sarif.runs[0].results.length + ' finding(s).');
          JSEOF
          node /tmp/audit-to-sarif.js

      - name: Upload npm audit SARIF
        if: always() && hashFiles('npm-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: npm-audit.sarif
          category: npm-audit

      - name: Run npm audit
        shell: bash
        run: |
          [ -f package-lock.json ] || { echo "package-lock.json not found, skipping npm audit."; exit 0; }
          echo "🔍 Running npm audit for known vulnerabilities..."
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=moderate --omit=dev || \
            echo "⚠️  MODERATE vulnerabilities detected above (non-blocking). Review and schedule remediation."
          npm audit --audit-level=critical || \
            echo "⚠️  CRITICAL dev-dependency vulnerability detected (non-blocking). Review immediately."
          echo "✅ npm audit passed."

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          GH_REF: ${{ github.ref }}
        run: |
          {
            echo "### npm Script Audit"
            echo "**Result:** $JOB_STATUS  "
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')  "
            echo "**Ref:** \`$GH_REF\`  "
            echo "**Run:** [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

  audit-workflows:
    name: Audit GitHub Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint workflows with actionlint
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

      - name: Check for dangerous workflow patterns
        shell: bash
        run: |
          echo "🔍 Auditing GitHub Actions workflows..."

          FOUND_ISSUES=0

          # Derive this workflow's own filename so it can be excluded from the scan.
          # The audit's own grep patterns and echo strings would otherwise cause false positives.
          SELF_FILE="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"

          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$workflow" ] || continue
            [ "$(basename "$workflow")" = "$SELF_FILE" ] && continue
            echo "Checking: $workflow"

            # Check for pull_request_target with checkout of PR code (pwn-request attack)
            if grep -q "pull_request_target" "$workflow"; then
              if grep -qE '(pull_request\.head\.sha|pull_request\.head\.ref|github\.head_ref)' "$workflow"; then
                echo "🚨 CRITICAL: $workflow uses pull_request_target with PR head ref checkout!"
                echo "   This is a known attack vector. See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/"
                FOUND_ISSUES=1
              fi
            fi

            # Check for script injection via untrusted event data in run: blocks.
            # Pre-filter removes YAML key-value assignment lines (env:, if:, with: params)
            # which are safe usage patterns. Only direct interpolation in run: content is dangerous.
            if grep -vE '^\s+[A-Za-z_][A-Za-z0-9_-]*:\s+\$\{\{' "$workflow" | \
               grep -qE '\$\{\{[^}]*(github\.(head_ref|actor)\b|github\.event\.(issue|pull_request|comment|review|discussion|label|sender|workflow_run)\.)'; then
              echo "🚨 CRITICAL: $workflow may be vulnerable to script injection via untrusted event data!"
              echo "   Dangerous context var used directly in run: block content (head_ref, actor, event.pull_request.*, event.workflow_run.head_branch, etc.)"
              echo "   Use an intermediate env var instead: add 'env: { MY_VAR: <expr> }' before the run step and use \$MY_VAR in the script."
              FOUND_ISSUES=1
            fi

            # Check for unpinned third-party actions — flag anything not pinned to exactly 40 hex chars.
            # Escalate to CRITICAL when the same workflow also passes GITHUB_TOKEN (supply-chain + token theft).
            if grep -E "^\s+uses: [a-zA-Z0-9_-]+/[a-zA-Z0-9_./-]+@" "$workflow" \
               | grep -qvE "@[a-f0-9]{40}(\s|$)"; then
              if grep -qE '(GITHUB_TOKEN|github\.token)' "$workflow"; then
                echo "🚨 CRITICAL: $workflow passes GITHUB_TOKEN to an unpinned third-party action!"
                echo "   An attacker can force-push the tag to a malicious commit and exfiltrate the token."
                FOUND_ISSUES=1
              else
                echo "⚠️  WARNING: $workflow uses unpinned or short-SHA third-party action(s). Pin to a full 40-char commit SHA."
              fi
            fi

            # Check for workflow_run trigger
            if grep -q "workflow_run" "$workflow"; then
              echo "⚠️  WARNING: $workflow uses workflow_run trigger. Ensure inputs are validated."
            fi

            # Check for missing top-level permissions block
            if ! grep -qE '^permissions:' "$workflow"; then
              echo "⚠️  WARNING: $workflow lacks top-level permissions block. Add 'permissions: {}' at workflow level."
            fi

            # Check for missing job-level timeout-minutes
            if ! grep -qE '^\s+timeout-minutes:' "$workflow"; then
              echo "⚠️  WARNING: $workflow has no job-level timeout-minutes. Jobs may run up to 6 hours by default."
            fi

            # Check for secrets interpolated directly in run: steps (may leak to debug logs)
            if grep -vE '^\s+[A-Za-z_][A-Za-z0-9_-]*:\s+\$\{\{' "$workflow" | \
               grep -qE '\$\{\{\s*secrets\.'; then
              echo "⚠️  WARNING: $workflow may interpolate a secret directly in a run: step. Gate through env: instead."
            fi

            # Check for overly permissive blanket grants
            if grep -qE '^[[:space:]]*permissions:[[:space:]]*(write-all|read-all)' "$workflow"; then
              echo "🚨 CRITICAL: $workflow uses blanket permissions (write-all/read-all)!"
              FOUND_ISSUES=1
            fi

            # Check for id-token: write (enables OIDC — flag for manual review)
            if grep -qE '^[[:space:]]*id-token:[[:space:]]*write' "$workflow"; then
              echo "⚠️  WARNING: $workflow grants id-token: write (OIDC token). Verify this is intentional."
            fi

            # Check for continue-on-error: true (can silence security step failures)
            if grep -qE '^[[:space:]]*continue-on-error:[[:space:]]*true' "$workflow"; then
              echo "⚠️  WARNING: $workflow has continue-on-error: true — verify it is not on a security-critical step."
            fi

            # Check for secrets: inherit in reusable workflow calls (passes all repo secrets)
            if grep -qE '^\s+secrets:\s+inherit' "$workflow"; then
              echo "⚠️  WARNING: $workflow uses secrets: inherit — verify the called workflow needs all repository secrets."
            fi

          done

          if [ "$FOUND_ISSUES" -eq 1 ]; then
            exit 1
          fi

          echo "✅ Workflow audit passed."

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          GH_REF: ${{ github.ref }}
        run: |
          {
            echo "### Workflow Audit"
            echo "**Result:** $JOB_STATUS  "
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')  "
            echo "**Ref:** \`$GH_REF\`  "
            echo "**Run:** [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # Deny strongly copyleft licenses incompatible with Apache-2.0 / MIT projects.
          # Adjust or extend this list to match the project's own license policy.
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
