name: Comment Front Matter Properties

# Companion to "Check Front Matter Properties". That check runs on
# `pull_request`, where a fork's GITHUB_TOKEN is read-only and cannot comment.
# This workflow runs in the base-repo context on `workflow_run`, so it has a
# write token and can post the sticky comment on fork PRs too. It never checks
# out or executes PR code. The downloaded artifact is produced by PR-controlled
# code and is therefore UNTRUSTED: the target PR is resolved from trusted
# workflow_run/commit data (never from the artifact), and the comment body is
# sanitized before posting.

on:
  workflow_run:
    workflows: ['Check Front Matter Properties']
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Post sticky comment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # PR-triggered runs only. Runs whether the check passed or failed, so the
    # explanatory comment is posted exactly when the check fails.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    permissions:
      actions: read # download the artifact from the triggering run
      contents: read # resolve the PR associated with the head commit
      pull-requests: write # create/update the PR comment
    steps:
      - name: Download comment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontmatter-comment
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upsert sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- frontmatter-properties-check -->';
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            // Resolve the target PR from TRUSTED data only — never from the artifact,
            // which is produced by PR-controlled code and could name any PR.
            let prNumber = run.pull_requests && run.pull_requests[0] && run.pull_requests[0].number;
            if (!prNumber) {
              // Fork PRs: workflow_run.pull_requests is empty — resolve via the commit,
              // validating head sha/branch/repo against this run.
              const assoc = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner: context.repo.owner, repo: context.repo.repo, commit_sha: headSha, per_page: 100 }
              );
              const m = assoc.find(p =>
                p.state === 'open' &&
                p.head && p.head.sha === headSha &&
                p.head.ref === run.head_branch &&
                p.head.repo && p.head.repo.full_name === run.head_repository.full_name
              );
              prNumber = m ? m.number : null;
            }
            if (!prNumber) { core.info('No PR resolved for this run — nothing to do.'); return; }

            // Artifact contents are UNTRUSTED. has-findings only gates whether a NEW
            // comment is created; we only ever act on the resolved (trusted) PR, so an
            // attacker can at most affect their own PR's comment.
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
            const hasFindings = /1/.test(read('artifact/has-findings.txt'));
            let body = read('artifact/body.md');
            if (!body.trim()) { core.info('Empty comment body — nothing to do.'); return; }

            // Sanitize the untrusted body: strip ALL HTML-comment markers so it cannot
            // forge our sticky marker or hijack another sticky comment, and cap length.
            body = body.replace(/<!--[\s\S]*?-->/g, '').trim().slice(0, 60000);
            const commentBody = `${marker}\n${body}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: commentBody,
              });
              core.info(`Updated sticky comment ${existing.id} on PR #${prNumber}.`);
            } else if (hasFindings) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body: commentBody,
              });
              core.info(`Created sticky comment on PR #${prNumber}.`);
            } else {
              core.info('No findings and no existing comment — nothing to post.');
            }
