name: Comment Front Matter Properties

# Companion to "Check Front Matter Properties". That check runs on
# `pull_request`, where a fork's GITHUB_TOKEN is read-only and cannot comment.
# This workflow runs in the base-repo context on `workflow_run`, so it has a
# write token and can post the sticky comment on fork PRs too. It never checks
# out or executes PR code (no pwn-request), and — crucially — it derives the
# target PR from the TRUSTED workflow_run payload, never from the artifact. The
# artifact is produced by the untrusted PR build and only supplies the comment
# body; a malicious PR must not be able to choose which PR gets commented on.

on:
  workflow_run:
    workflows: ['Check Front Matter Properties']
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Post sticky comment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # PR-triggered runs only. Runs whether the check passed or failed, so the
    # explanatory comment is posted exactly when the check fails.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    permissions:
      actions: read # download the artifact from the triggering run
      pull-requests: write # create/update the PR comment
    steps:
      - name: Download comment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontmatter-comment
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upsert sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MARKER: '<!-- frontmatter-properties-check -->'
        run: |
          set -euo pipefail

          # SECURITY: resolve the target PR from the TRUSTED workflow_run payload,
          # NEVER from the artifact. head_sha is set by GitHub (not the PR author),
          # whereas artifact/pr.txt is written by the untrusted PR build and is
          # deliberately ignored here — otherwise a malicious PR could point the
          # bot comment at any PR. Match the PR whose head commit is this run's
          # head_sha and whose base is this repo (so a fork branch that happens to
          # share the SHA cannot be mistargeted).
          PR="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
                 --jq "[.[] | select(.base.repo.full_name == \"$GH_REPO\")][0].number // empty")"
          if [ -z "$PR" ]; then
            echo "No open PR in $GH_REPO for head $HEAD_SHA — nothing to do."
            exit 0
          fi

          HAS="$(tr -dc '0-9' < artifact/has-findings.txt)"

          # Body is untrusted content, but it can now only land on its own PR.
          # jq -Rs reads the whole file as a single JSON string → safe payload.
          jq -Rs '{body: .}' artifact/body.md > payload.json

          # Find an existing sticky comment by its hidden marker.
          CID="$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1 || true)"

          if [ -n "$CID" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$CID" --input payload.json > /dev/null
            echo "Updated sticky comment $CID on PR #$PR."
          elif [ "$HAS" = "1" ]; then
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" --input payload.json > /dev/null
            echo "Created sticky comment on PR #$PR."
          else
            echo "No errors and no existing comment — nothing to post."
          fi
