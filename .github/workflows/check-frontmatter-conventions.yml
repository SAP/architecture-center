name: Check Front Matter Conventions

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'src/_scripts/_check-frontmatter-conventions.js'
      - '.github/workflows/check-frontmatter-conventions.yml'

permissions: {}

jobs:
  check-frontmatter-conventions:
    name: Check Front Matter Conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the base commit to diff the PR's changed files
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp today's date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Check front matter conventions (advisory)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node src/_scripts/_check-frontmatter-conventions.js
