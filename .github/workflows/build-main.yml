name: Build Validation

# Repurposed from a post-merge "build + upload Pages artifact" (the artifact was
# never deployed by any job) into a build-breakage gate: validate on every PR, and
# keep direct pushes to dev covered (core devs push to dev directly). Pushes to main
# are intentionally omitted — deploy-to-cloudflare already builds on push to main.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # full history needed: docusaurus showLastUpdateTime/Author reads git log
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
