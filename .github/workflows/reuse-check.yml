name: REUSE Compliance Check

# Runs on PRs as a NON-BLOCKING license-compliance signal (continue-on-error)
# during an initial rollout cycle. Once the repo is confirmed REUSE-compliant on
# PRs, remove `continue-on-error` below to turn this into a required gate.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance-check:
    name: REUSE Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: REUSE Compliance Check
        continue-on-error: true # non-blocking during rollout; remove to enforce
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5
