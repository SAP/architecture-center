name: Deploy main site to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  # Serialise production deploys; never cancel an in-flight deploy to the live site.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: cloudflare
    env:
      BACKEND_API_URL: ${{ vars.SAP_AUTH_BACKEND_BASE_URL }}
      EXPRESS_BACKEND_URL: ${{ vars.QUICKSTART_CAP_PORT_BACKEND_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch complete history for step "export drawios" to safely determine
          # date of last update to drawio files via git log
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Fetch contributors details from GitHub API
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: node src/_scripts/_fetch-contributors-details.js

      - name: Cache drawio svgs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/architecture-center/drawio-svgs
          key: drawio-svgs-runner-${{ runner.os }}-branch-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            drawio-svgs-runner-${{ runner.os }}-branch-${{ github.ref_name }}-

      - name: Export drawios to svgs
        run: CACHE_ENABLED=1 DOCKER=1 node src/_scripts/_export-drawios/_export.js

      - name: Build Website
        run: npm run build

      - name: Update drawio links with hashed URLs
        run: node src/_scripts/_update-drawio-links.js

      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build
          path: build
          # disable compression to decrease upload time of larger artifacts
          compression-level: 0

  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - name: Check out Wrangler toolchain lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Only the isolated, hash-pinned Wrangler install is needed here.
          sparse-checkout: .github/workflows/wrangler
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install Wrangler (isolated, hash-pinned)
        shell: bash
        # Install the whole Wrangler dependency tree from the committed lockfile
        # under .github/workflows/wrangler/ rather than resolving it fresh from
        # the registry at deploy time, while the Cloudflare production token is
        # in scope. Kept in its own lockfile so the root dependency tree and
        # local dev are unaffected (same pattern as .github/workflows/cspell/).
        # Pinned-Dependencies only credits `npm ci` against a committed lockfile.
        run: |
          npm ci --ignore-scripts --prefix .github/workflows/wrangler
          # Expose the locally installed wrangler binary to subsequent steps.
          echo "${GITHUB_WORKSPACE}/.github/workflows/wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download Build Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build
          path: build

      - name: Deploy to Cloudflare (Pages)
        env:
          CLOUDFLARE_PRODUCTION_ENVIRONMENT_LABEL: ${{ vars.CLOUDFLARE_PRODUCTION_ENVIRONMENT_LABEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PROD_ACCOUNT_ID }}
        run: wrangler pages deploy ./build --project-name sap-architecture-center --branch "$CLOUDFLARE_PRODUCTION_ENVIRONMENT_LABEL"
