name: Deploy site to Cloudflare

on:
  push:
    branches:
      - workflow-cloudflare-wrangler

permissions: {}

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch complete history for step "export drawios" to safely determine
          # date of last update to drawio files via git log
          fetch-depth: 5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: success()
    environment: cloudflare-env
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./build --project-name sap-architecture-center --branch some-branch-label-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
