name: Deploy main site to GitHub Pages

on:
  # for local PR builds esp. builds in forked repositories
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build Site
    runs-on: [ self-hosted, solinas ]
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # fetch complete history for step "export drawios" to safely determine
          # date of last update to drawio files via git log
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Get pages deployment URL
        run: |
          pages_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          url=$(echo "$pages_url"|cut -d'/' -f 1)//$(echo "$pages_url"|cut -d'/' -f 3)
          base_url=$(echo "$pages_url"|cut -d'/' -f 4)
          echo "url=$url" >> "$GITHUB_ENV"
          echo "base_url=$base_url" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: github.tools.sap

      - name: Patch docusaurus.config.ts
        run: |
          sed -E -i "s^url:(..*)^url: '$url',^g" docusaurus.config.ts
          sed -E -i "s^const baseUrl = '(.*)';^const baseUrl = '/$base_url';^g" docusaurus.config.ts

      - name: Fetch contributors details from GitHub API
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: node src/_scripts/_fetch-contributors-details.js

      - name: Cache drawio svgs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/architecture-center/drawio-svgs
          key: drawio-svgs-runner-${{ runner.os }}-branch-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            drawio-svgs-runner-${{ runner.os }}-branch-${{ github.ref_name }}-

      - name: Export drawios to svgs
        run: CACHE_ENABLED=1 DOCKER=1 node src/_scripts/_export-drawios/_export.js

      - name: Build Website
        run: npm run build
        # Scoped to this step only: npm ci lifecycle scripts and the drawio
        # export must not see these. Only the three the Docusaurus build
        # actually reads (docusaurus.config.ts) are passed; the VALIDATOR_OAUTH_*
        # / VALIDATOR_RULES_API_URL secrets are consumed solely by
        # _generate-validator-rules.js, which this workflow never runs.
        env:
          VALIDATOR_API_URL: ${{ secrets.VALIDATOR_API_URL }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          EXPRESS_BACKEND_URL: ${{ secrets.EXPRESS_BACKEND_URL }}

      - name: Update drawio links with hashed URLs
        run: node src/_scripts/_update-drawio-links.js

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@a753861a5debcf57bf8b404356158c8e1e33150c # v2 (last GHES-compatible major; v3+ bundles @actions/artifact v2, unsupported on GHES)
        with:
          path: build

  deploy:
    name: Deploy Site
    runs-on: [ self-hosted, solinas ]
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: success()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@de14547edc9944350dc0481aa5b7afb08e75f254 # v2 (last GHES-compatible major; v4+ downloads via @actions/artifact v2, unsupported on GHES)
