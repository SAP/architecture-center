name: Check Internal Links
# Archetype: CHANGED-FILES — only Markdown added/modified vs the PR base is scanned (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'news/**/*.md'
      - 'news/**/*.mdx'
      - 'src/_scripts/_check-internal-links.zsh'
      - '.github/workflows/check-internal-links.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-internal-links:
    name: Check Internal Links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed to diff changed Markdown against the PR base

      - name: Install zsh
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check for SAP-internal-only links
        shell: bash
        run: |
          # Changed-files scope: only Markdown added/modified vs the PR base.
          git -c core.quotePath=false diff --name-only -z --diff-filter=AMR "origin/${GITHUB_BASE_REF}...HEAD" -- docs news \
            | grep -zE '\.(md|mdx)$' > "$RUNNER_TEMP/changed.txt" || true
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            mapfile -d '' -t FILES < "$RUNNER_TEMP/changed.txt"
            zsh src/_scripts/_check-internal-links.zsh "${FILES[@]}"
          else
            {
              echo "### Internal link check"
              echo ""
              echo "✅ No changed Markdown under docs/ or news/ — nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "✅ No changed Markdown under docs/ or news/ — nothing to check."
          fi
