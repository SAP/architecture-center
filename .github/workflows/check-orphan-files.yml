name: Check Orphan Files
# Archetype: CHANGED-FILES — only assets added/modified vs the base (on a PR) or
# vs the previous commit (on a push to dev) are checked against all Markdown (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev]
    paths:
      - 'assets/**'
      - 'diagrams/**'
      - 'docs/**/*.png'
      - 'docs/**/*.jpg'
      - 'docs/**/*.jpeg'
      - 'docs/**/*.svg'
      - 'docs/**/*.drawio'
      - 'docs/**/*.docx'
      - '.github/actions/changed-files/action.yml'
      - '.github/workflows/check-orphan-files.yml'
  push:
    branches: [dev]
    paths:
      - 'assets/**'
      - 'diagrams/**'
      - 'docs/**/*.png'
      - 'docs/**/*.jpg'
      - 'docs/**/*.jpeg'
      - 'docs/**/*.svg'
      - 'docs/**/*.drawio'
      - 'docs/**/*.docx'
      - '.github/actions/changed-files/action.yml'
      - '.github/workflows/check-orphan-files.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-orphan-files:
    name: Check Orphan Files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need history to diff the PR base / previous commit

      # Scope to the assets changed on this PR / push to dev (shared logic).
      - name: Collect changed files
        id: changed
        uses: ./.github/actions/changed-files
        with:
          pathspec: assets diagrams docs
          filter-regex: '\.(png|jpg|jpeg|svg|drawio|docx)$'

      - name: Check for unreferenced files
        shell: bash
        run: |
          # Changed-files scope: only assets added/modified vs the base / previous commit.
          SCAN_FILES=()
          if [ "${{ steps.changed.outputs.any }}" = "true" ]; then
            mapfile -d '' -t SCAN_FILES < "${{ steps.changed.outputs.files-file }}"
          fi
          if [ "${#SCAN_FILES[@]}" -eq 0 ]; then
            {
              echo "### Orphan files check"
              echo ""
              echo "✅ No new or modified assets in this PR — nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "✅ No new or modified assets in this PR — nothing to check."
            exit 0
          fi

          # All Markdown files are needed to check whether each asset is referenced.
          mapfile -d '' -t MARKDOWN_FILES < <(find . -type f \( -name "*.md" -o -name "*.mdx" \) -print0)

          found_unused=0
          found_warn=0
          { echo "### Orphan files check"; echo ""; } >> "$GITHUB_STEP_SUMMARY"

          # Escape untrusted filenames for the Actions command channel so a crafted
          # path (newline, %, comma, colon) can't forge or corrupt annotations.
          esc_data() { local s=$1; s=${s//'%'/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}; printf '%s' "$s"; }
          esc_prop() { local s; s=$(esc_data "$1"); s=${s//,/%2C}; s=${s//:/%3A}; printf '%s' "$s"; }
          # Neutralise backticks/newlines in a PR-controlled path before it goes into
          # a Markdown inline-code span in the job summary, so it cannot break out.
          esc_sum() { printf '%s' "$1" | tr '`\n\r' '   '; }

          # Owning directory of a Markdown file: the nearest ancestor (starting from
          # its own directory) that holds a readme.md, bounded to the RA#### tree.
          # Used so a reference from a deeper nested sub-architecture does not count
          # toward an asset owned by a shallower one.
          owner_of() {
            local d; d=$(dirname "$1")
            while [[ "$d" == docs/ref-arch/RA[0-9][0-9][0-9][0-9]/* && ! -f "$d/readme.md" ]]; do
              d=$(dirname "$d")
            done
            printf '%s/' "$d"
          }

          for file in "${SCAN_FILES[@]}"; do
            [ -z "$file" ] && continue
            basename_file=$(basename "$file")

            # References to an RA-local asset live in that RA's own directory, so
            # scope the match there: a same-named asset in a different RA must not
            # mask a genuine orphan. Nested sub-architectures under one RA#### often
            # reuse identical asset names (e.g. drawio/architecture.drawio), so scope
            # to the OWNING sub-architecture — the nearest ancestor with a readme.md —
            # rather than the whole RA####. Non-RA / shared assets fall back to
            # repo-wide.
            scope=""
            if [[ "$file" =~ ^(docs/ref-arch/RA[0-9]{4})/ ]]; then
              ra_root="${BASH_REMATCH[1]}"
              scope_dir=$(dirname "$file")
              while [[ "$scope_dir" == "$ra_root"/* && ! -f "$scope_dir/readme.md" ]]; do
                scope_dir=$(dirname "$scope_dir")
              done
              if [ -f "$scope_dir/readme.md" ]; then
                scope="$scope_dir/"
              else
                scope="$ra_root/"
              fi
            fi

            found_scoped=false
            found_global=false
            for md in "${MARKDOWN_FILES[@]}"; do
              grep -qF -- "$basename_file" "$md" || continue
              found_global=true
              md_rel="${md#./}"
              if [ -z "$scope" ]; then
                found_scoped=true
                break
              fi
              # Count the reference only if it lives in the asset's scope AND is
              # owned by that same scope — not by a deeper nested sub-architecture
              # whose own same-named asset would otherwise mask this orphan.
              if [[ "$md_rel" == "$scope"* ]] && [ "$(owner_of "$md_rel")" = "$scope" ]; then
                found_scoped=true
                break
              fi
            done

            if [ "$found_scoped" = true ]; then
              continue
            fi

            if [ "$found_global" = true ]; then
              # Matched only OUTSIDE the asset's owning sub-architecture: likely a
              # shared asset, or a same-named file masking a real orphan. Warn (don't
              # fail) so a genuinely shared asset never blocks the PR.
              echo "- ⚠️ \`$(esc_sum "$file")\`: referenced only outside its owning sub-architecture (shared asset, or possible orphan masked by a same-named file)" >> "$GITHUB_STEP_SUMMARY"
              [ -n "$GITHUB_ACTIONS" ] && \
                echo "::warning file=$(esc_prop "$file"),title=Orphan files::Referenced only outside its owning sub-architecture — verify this asset is actually used."
              found_warn=1
            else
              echo "- ❌ \`$(esc_sum "$file")\`" >> "$GITHUB_STEP_SUMMARY"
              [ -n "$GITHUB_ACTIONS" ] && \
                echo "::error file=$(esc_prop "$file"),title=Orphan files::Asset is not referenced in any Markdown file"
              found_unused=1
            fi
          done

          if [ "$found_unused" -ne 0 ]; then
            { echo ""; echo "❌ Unreferenced asset(s) found — remove them or reference them before merging."; } >> "$GITHUB_STEP_SUMMARY"
            { echo ""; echo "📖 How to fix (reference the asset from a page or remove it): https://architecture.learning.sap.com/docs/community/automated-checks/document-body/orphan-files"; } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$found_warn" -ne 0 ]; then
            { echo ""; echo "⚠️ Some assets matched only outside their owning sub-architecture — review the warnings above."; } >> "$GITHUB_STEP_SUMMARY"
            { echo ""; echo "📖 How to fix (reference the asset from a page or remove it): https://architecture.learning.sap.com/docs/community/automated-checks/document-body/orphan-files"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No unreferenced files found!" >> "$GITHUB_STEP_SUMMARY"
          fi

          [ "$found_unused" -eq 0 ] || exit 1
