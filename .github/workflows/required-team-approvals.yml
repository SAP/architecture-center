name: Required team approvals

# Enforces the review policy that native branch protection cannot express:
#   - The admin team must approve EVERY pull request.
#   - The reviewer team must approve pull requests that touch the paths it owns
#     in .github/CODEOWNERS (the reviewer-owned paths are read from that file,
#     so CODEOWNERS stays the single source of truth).
# The result is published as the commit status "required-team-approvals",
# which must be added as a required status check on the protected branch.
#
# Why workflow_run: a pull_request_review event on a pull request from a fork does
# not receive repository secrets, so TEAM_REVIEW_TOKEN (needed to read org team
# membership) would be empty and the evaluation would fail with
# "Input required and not supplied: github-token". A workflow_run always runs in
# the trusted base context with secrets, whatever triggered the upstream workflow,
# so the evaluation works for fork pull requests too. The companion "Collect
# team-approval context" workflow runs on the pull_request_target and
# pull_request_review events and hands the pull request number over via an
# artifact. No code from the pull request head is ever executed here: the pull
# request number is the only thing that crosses over, and everything else comes
# from the API against the trusted base.
#
# The pull request number cannot be keyed into workflow-level concurrency: it is
# not in the workflow_run event (that is why it travels via the artifact), and
# workflow_run.head_sha is the base commit for pull_request_target-triggered runs,
# so it would collide across unrelated pull requests. Concurrency is therefore
# applied at the "team-approvals" job, keyed by the pull request number recovered
# in the "context" job.

on:
  workflow_run:
    workflows: ["Collect team-approval context"]
    types: [completed]

permissions:
  contents: read
  actions: read # download the pull-request-number artifact from the triggering run

jobs:
  context:
    name: Resolve pull request number
    # workflow_run fires for every completed conclusion. A collect run that was
    # cancelled (superseded by its own concurrency) or failed never uploaded the
    # artifact, so skip it rather than fail noisily downloading a missing one.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [ self-hosted, solinas ]
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.read.outputs.pr }}
    steps:
      - name: Download pull request number
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          # Default GITHUB_TOKEN is enough to read artifacts (actions: read).
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const match = artifacts.find(a => a.name === 'team-approvals-pr-context');
            if (!match) {
              throw new Error(
                'team-approvals-pr-context artifact not found on the triggering run',
              );
            }
            const zip = await github.rest.actions.downloadArtifact({
              owner, repo, artifact_id: match.id, archive_format: 'zip',
            });
            fs.writeFileSync('pr-context.zip', Buffer.from(zip.data));

      - name: Unzip pull request number
        run: unzip -o pr-context.zip

      - name: Read pull request number
        id: read
        run: |
          pr="$(cat number)"
          case "$pr" in
            '' | *[!0-9]*)
              echo "Invalid pull request number from artifact: '$pr'" >&2
              exit 1
              ;;
          esac
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  team-approvals:
    name: Required team approvals
    needs: context
    runs-on: [ self-hosted, solinas ]
    timeout-minutes: 5
    # Keyed by pull request number (now known), so evaluations of the SAME pull
    # request supersede each other while unrelated pull requests never collide.
    concurrency:
      group: required-team-approvals-${{ needs.context.outputs.pr }}
      cancel-in-progress: true
    steps:
      - name: Evaluate team approvals
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr }}
        with:
          # A token that can read organization team membership. The default
          # GITHUB_TOKEN cannot. See the setup notes in the repository docs.
          github-token: ${{ secrets.TEAM_REVIEW_TOKEN }}
          script: |
            const org = context.repo.owner;                       // OCTO
            const adminTeam = 'architecture-center-admin';
            const reviewerTeam = 'architecture-center-reviewer';
            const reviewerRef = `@${org}/${reviewerTeam}`;
            const statusContext = 'required-team-approvals';
            const { owner, repo } = context.repo;

            // The only thing carried over from the triggering workflow.
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (!Number.isInteger(prNumber)) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }

            // Resolve the current head and base of that pull request from the API.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            const headSha = pr.head.sha;
            const baseSha = pr.base.sha;

            const setStatus = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha,
                context: statusContext, state,
                description: description.slice(0, 140),
              });

            try {
              // 1. Reviewer-owned paths, derived from the trusted base CODEOWNERS.
              //    Read at base.sha (a commit on the base branch a fork cannot
              //    push to), so a fork cannot weaken the rules.
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: '.github/CODEOWNERS', ref: baseSha,
              });
              const codeowners = Buffer.from(file.content, file.encoding).toString('utf8');
              const reviewerPaths = [];
              for (const raw of codeowners.split('\n')) {
                const line = raw.replace(/#.*/, '').trim();
                if (!line) continue;
                const [pattern, ...owners] = line.split(/\s+/);
                if (pattern === '*') continue; // the '*' fallback belongs to admin
                if (owners.includes(reviewerRef)) {
                  reviewerPaths.push(pattern.replace(/^\//, ''));
                }
              }

              // 2. Users whose latest review is an approval.
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100,
              });
              const latest = new Map();
              for (const r of reviews) {
                if (!r.user) continue;
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) {
                  latest.set(r.user.login, r.state);
                }
              }
              const approvers = new Set(
                [...latest].filter(([, s]) => s === 'APPROVED').map(([u]) => u)
              );

              // 3. Team membership.
              const membersOf = async (team) => new Set(
                (await github.paginate(github.rest.teams.listMembersInOrg, {
                  org, team_slug: team, per_page: 100,
                })).map(m => m.login)
              );
              const adminMembers = await membersOf(adminTeam);
              const reviewerMembers = await membersOf(reviewerTeam);
              const adminApproved = [...approvers].some(u => adminMembers.has(u));
              const reviewerApproved = [...approvers].some(u => reviewerMembers.has(u));

              // 4. Does this pull request touch reviewer-owned paths?
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: prNumber, per_page: 100,
              });
              const touchesReviewerPaths = files.some(f =>
                reviewerPaths.some(p =>
                  p.endsWith('/') ? f.filename.startsWith(p) : f.filename === p
                )
              );

              // 5. Evaluate the policy.
              const missing = [];
              if (!adminApproved) missing.push(adminTeam);
              if (touchesReviewerPaths && !reviewerApproved) missing.push(reviewerTeam);

              if (missing.length === 0) {
                const msg = touchesReviewerPaths
                  ? 'Approved by the admin and reviewer teams.'
                  : 'Approved by the admin team (no reviewer-owned paths changed).';
                await setStatus('success', msg);
                core.info(msg);
              } else {
                const msg = `Waiting on approval from: ${missing.join(', ')}.`;
                await setStatus('failure', msg);
                core.setFailed(msg);
              }
            } catch (err) {
              await setStatus('error', `Approval check failed: ${err.message}`);
              throw err;
            }
