name: Check drawio Files
# Archetype: CHANGED-FILES — only *.drawio added/modified vs the base (on a PR) or
# vs the previous commit (on a push to dev) is checked (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev]
    paths:
      - '**.drawio'
      - '.github/actions/changed-files/action.yml'
      - '.github/workflows/check-drawio-file.yml'
  push:
    branches: [dev]
    paths:
      - '**.drawio'
      - '.github/actions/changed-files/action.yml'
      - '.github/workflows/check-drawio-file.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-drawio-file:
    name: Check drawio Files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need history to diff the PR base / previous commit

      # Scope to the *.drawio changed on this PR / push to dev (shared logic).
      - name: Collect changed files
        id: changed
        uses: ./.github/actions/changed-files
        with:
          pathspec: '.'
          filter-regex: '\.drawio$'

      - name: List changed drawio files
        id: list
        shell: bash
        # Gate the checks below on whether any .drawio changed; both read the shared set.
        run: |
          if [ "${{ steps.changed.outputs.any }}" != "true" ]; then
            {
              echo "### drawio file size check"
              echo ""
              echo "✅ No changed drawio files in this PR — nothing to check."
              echo ""
              echo "### drawio external image references check"
              echo ""
              echo "✅ No changed drawio files in this PR — nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check drawio file sizes
        if: steps.list.outputs.skip != 'true'
        shell: bash
        run: |
          MAX_BYTES=$(( 1024 * 1024 ))
          found=0
          summary_lines=()

          FILES=()
          if [ "${{ steps.changed.outputs.any }}" = "true" ]; then
            mapfile -d '' -t FILES < "${{ steps.changed.outputs.files-file }}"
          fi

          # Escape untrusted filenames for the Actions command channel so a crafted
          # path (newline, %, comma, colon) can't forge or corrupt annotations.
          esc_data() { local s=$1; s=${s//'%'/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}; printf '%s' "$s"; }
          esc_prop() { local s; s=$(esc_data "$1"); s=${s//,/%2C}; s=${s//:/%3A}; printf '%s' "$s"; }
          # Neutralise backticks/newlines in a PR-controlled path before it goes into
          # a Markdown inline-code span in the job summary, so it cannot break out.
          esc_sum() { printf '%s' "$1" | tr '`\n\r' '   '; }

          for file in "${FILES[@]}"; do
            [ -f "$file" ] || continue
            SIZE=$(wc -c < "$file")
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              SIZE_KB=$(( (SIZE + 1023) / 1024 ))
              echo "❌ ${file} is too large (${SIZE_KB} KB). Maximum allowed size is 1024 KB."
              [ -n "$GITHUB_ACTIONS" ] && echo "::error file=$(esc_prop "$file"),title=drawio size::$(esc_data "$file") is too large (${SIZE_KB} KB). Maximum allowed size is 1024 KB."
              summary_lines+=("- ❌ \`$(esc_sum "$file")\`: ${SIZE_KB} KB (limit: 1024 KB)")
              found=1
            fi
          done

          {
            echo "### drawio file size check"
            echo ""
            if [ "$found" -eq 0 ]; then
              echo "✅ All drawio files are within the 1024 KB size limit."
            else
              echo "❌ Oversized file(s) found:"
              echo ""
              printf '%s\n' "${summary_lines[@]}"
              echo ""
              echo "Please reduce the size of the flagged file(s) before merging."
              echo ""
              echo "📖 How to fix (reduce the file below 1 MB or embed the image): https://architecture.learning.sap.com/docs/community/automated-checks/document-body/drawio-files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Please reduce the size of the flagged file(s) before merging."
            exit 1
          fi

          echo "✅ All drawio files are within the 1024 KB size limit."

      - name: Check drawio files for external image references
        if: always() && steps.list.outputs.skip != 'true'
        shell: bash
        run: |
          found=0
          summary_lines=()

          FILES=()
          if [ "${{ steps.changed.outputs.any }}" = "true" ]; then
            mapfile -d '' -t FILES < "${{ steps.changed.outputs.files-file }}"
          fi

          # Escape untrusted filenames for the Actions command channel so a crafted
          # path (newline, %, comma, colon) can't forge or corrupt annotations.
          esc_data() { local s=$1; s=${s//'%'/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}; printf '%s' "$s"; }
          esc_prop() { local s; s=$(esc_data "$1"); s=${s//,/%2C}; s=${s//:/%3A}; printf '%s' "$s"; }
          # Neutralise backticks/newlines in a PR-controlled path before it goes into
          # a Markdown inline-code span in the job summary, so it cannot break out.
          esc_sum() { printf '%s' "$1" | tr '`\n\r' '   '; }

          for file in "${FILES[@]}"; do
            [ -f "$file" ] || continue
            MATCHES=$(grep -E 'image=https?://' "$file" || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ ${file} contains external image references (image=http)."
              echo "   External images are not allowed in drawio files. Please embed the image directly."
              [ -n "$GITHUB_ACTIONS" ] && echo "::error file=$(esc_prop "$file"),title=drawio external image::$(esc_data "$file") contains an external image reference (image=http). Embed the image directly."
              summary_lines+=("- ❌ \`$(esc_sum "$file")\`: contains external image reference(s)")
              found=1
            fi
          done

          {
            echo "### drawio external image references check"
            echo ""
            if [ "$found" -eq 0 ]; then
              echo "✅ No external image references found in drawio files."
            else
              echo "❌ External image reference(s) found:"
              echo ""
              printf '%s\n' "${summary_lines[@]}"
              echo ""
              echo "Replace all external image URLs with embedded (base64) images in the flagged file(s)."
              echo ""
              echo "📖 How to fix (reduce the file below 1 MB or embed the image): https://architecture.learning.sap.com/docs/community/automated-checks/document-body/drawio-files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Replace all external image URLs with embedded (base64) images in the flagged file(s)."
            exit 1
          fi

          echo "✅ No external image references found in drawio files."
