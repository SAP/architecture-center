name: Check drawio Files

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '**.drawio'

permissions: {}

jobs:
  check-drawio-size:
    name: Check drawio File Sizes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check drawio file sizes
        shell: bash
        run: |
          MAX_BYTES=$(( 1024 * 1024 ))
          FOUND=0

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            SIZE=$(wc -c < "$file")
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              SIZE_KB=$(( SIZE / 1024 ))
              echo "❌ ${file} is too large (${SIZE_KB} KB). Maximum allowed size is 1024 KB."
              FOUND=1
            fi
          done < <(git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '\.drawio$')

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "Please reduce the size of the flagged file(s) before merging."
            exit 1
          fi

          echo "✅ All drawio files are within the 1024 KB size limit."

      - name: Check drawio files for external image references
        shell: bash
        env:
          PYCODE: |
            import sys, base64, zlib, urllib.parse, xml.etree.ElementTree as ET
            filename = sys.argv[1]
            with open(filename, "rb") as f:
                raw = f.read()
            if b"image=http" in raw:
                sys.exit(1)
            try:
                for el in ET.fromstring(raw).iter():
                    if not el.tag.endswith("diagram"):
                        continue
                    c = (el.text or "").strip()
                    if not c:
                        continue
                    try:
                        xml_str = zlib.decompress(base64.b64decode(urllib.parse.unquote(c)), -15).decode()
                        if "image=http" in xml_str:
                            sys.exit(1)
                    except Exception:
                        pass
            except Exception:
                pass
            sys.exit(0)
        run: |
          FOUND=0

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            if ! python3 -c "$PYCODE" "$file"; then
              echo "❌ ${file} contains external image references (image=http:// or image=https://)."
              echo "   External images are not allowed in drawio files. Please embed the image directly."
              FOUND=1
            fi
          done < <(git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '\.drawio$')

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "Replace all external image URLs with embedded (base64) images in the flagged file(s)."
            exit 1
          fi

          echo "✅ No external image references found in drawio files."
