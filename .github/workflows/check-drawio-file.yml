name: Check drawio Files
# Archetype: CHANGED-FILES — only *.drawio added/modified vs the PR base is checked (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '**.drawio'
      - '.github/workflows/check-drawio-file.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drawio-file:
    name: Check drawio Files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed to diff *.drawio against the PR base

      - name: List changed drawio files
        id: list
        shell: bash
        # Compute the changed-*.drawio set ONCE; both checks below read this file.
        # `|| true` is required: grep exits 1 when no .drawio changed, which would
        # otherwise fail the step under bash's default -eo pipefail.
        run: |
          git diff --name-only --diff-filter=AMR "origin/${GITHUB_BASE_REF}...HEAD" \
            | grep -E '\.drawio$' > "$RUNNER_TEMP/changed-drawio.txt" || true
          if [ ! -s "$RUNNER_TEMP/changed-drawio.txt" ]; then
            {
              echo "### drawio file size check"
              echo ""
              echo "✅ No changed drawio files in this PR — nothing to check."
              echo ""
              echo "### drawio external image references check"
              echo ""
              echo "✅ No changed drawio files in this PR — nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check drawio file sizes
        if: steps.list.outputs.skip != 'true'
        shell: bash
        run: |
          MAX_BYTES=$(( 1024 * 1024 ))
          found=0
          summary_lines=()

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            SIZE=$(wc -c < "$file")
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              SIZE_KB=$(( SIZE / 1024 ))
              echo "❌ ${file} is too large (${SIZE_KB} KB). Maximum allowed size is 1024 KB."
              [ -n "$GITHUB_ACTIONS" ] && echo "::error file=${file},title=drawio size::${file} is too large (${SIZE_KB} KB). Maximum allowed size is 1024 KB."
              summary_lines+=("- ❌ \`${file}\` — ${SIZE_KB} KB (limit: 1024 KB)")
              found=1
            fi
          done < "$RUNNER_TEMP/changed-drawio.txt"

          {
            echo "### drawio file size check"
            echo ""
            if [ "$found" -eq 0 ]; then
              echo "✅ All drawio files are within the 1024 KB size limit."
            else
              echo "❌ Oversized file(s) found:"
              echo ""
              printf '%s\n' "${summary_lines[@]}"
              echo ""
              echo "Please reduce the size of the flagged file(s) before merging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Please reduce the size of the flagged file(s) before merging."
            exit 1
          fi

          echo "✅ All drawio files are within the 1024 KB size limit."

      - name: Check drawio files for external image references
        if: always() && steps.list.outputs.skip != 'true'
        shell: bash
        run: |
          found=0
          summary_lines=()

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            MATCHES=$(grep -F 'image=http' "$file" || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ ${file} contains external image references (image=http)."
              echo "   External images are not allowed in drawio files. Please embed the image directly."
              [ -n "$GITHUB_ACTIONS" ] && echo "::error file=${file},title=drawio external image::${file} contains an external image reference (image=http). Embed the image directly."
              summary_lines+=("- ❌ \`${file}\` — contains external image reference(s)")
              found=1
            fi
          done < "$RUNNER_TEMP/changed-drawio.txt"

          {
            echo "### drawio external image references check"
            echo ""
            if [ "$found" -eq 0 ]; then
              echo "✅ No external image references found in drawio files."
            else
              echo "❌ External image reference(s) found:"
              echo ""
              printf '%s\n' "${summary_lines[@]}"
              echo ""
              echo "Replace all external image URLs with embedded (base64) images in the flagged file(s)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Replace all external image URLs with embedded (base64) images in the flagged file(s)."
            exit 1
          fi

          echo "✅ No external image references found in drawio files."
