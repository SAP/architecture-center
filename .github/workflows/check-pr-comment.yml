name: PR Check Comment
# Aggregates the content checks' findings into ONE sticky PR comment, grouped by
# check. Runs via workflow_run (base-repo context) so it can comment on fork PRs
# without exposing a writable token to PR code: it NEVER checks out PR content and
# only reads data (check-run annotations + one artifact). Rebuilds the whole comment
# on every trigger, so it is idempotent and safe against overlapping check completions.

on:
  workflow_run:
    workflows:
      - Check Internal Links
      - Check SEO Front Matter
      - Check Front Matter Properties
      - Check Contributor IDs
      - Check Reference Architecture IDs
      - Check H1 Title
      - Check drawio Files
      - Check Orphan Files
      - Check External Links
      - Check Spelling
      - Check Typos
    types: [completed]

permissions: {}

concurrency:
  # Serialize per PR source so overlapping check completions don't corrupt the comment.
  group: ${{ format('pr-check-comment-{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      pull-requests: write
      actions: read
      contents: read
    steps:
      - name: Resolve PR and locate ext-links artifact
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;
            const headRepo = context.payload.workflow_run.head_repository.full_name;
            const headOwner = headRepo.split('/')[0];

            // Resolve the PR by its head ref (owner:branch). listPullRequestsAssociatedWithCommit
            // returns nothing for fork PRs (a fork's head commit is not in the base repo's
            // commit->PR index), which previously left every fork PR with no comment. pulls.list
            // with head="owner:branch" resolves fork and same-repo PRs alike. We still match on the
            // authoritative head sha/ref/repo from the PR object (never on artifact contents), so
            // the cross-PR comment-spoofing guard is preserved.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${headOwner}:${headBranch}`, per_page: 100,
            });
            const match = prs.find(p =>
              p.head && p.head.sha === headSha &&
              p.head.ref === headBranch &&
              p.head.repo && p.head.repo.full_name === headRepo
            );
            core.setOutput('pr', match ? String(match.number) : '');

            // Latest "Check External Links" run for this commit (its findings live in
            // an artifact, not annotations). Validate the run's head branch and
            // repository too: a fork PR can reuse the same public commit SHA, so
            // matching on SHA + workflow name alone would let it smuggle in another
            // run's artifact for this (privileged) comment step.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              event: 'pull_request', head_sha: headSha, per_page: 100,
            });
            const ext = runs
              .filter(r =>
                r.name === 'Check External Links' &&
                r.head_branch === headBranch &&
                r.head_repository?.full_name === headRepo
              )
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            core.setOutput('extlinks_run_id', ext ? String(ext.id) : '');
            core.setOutput('head_sha', headSha);

      - name: Download ext-links findings
        if: steps.resolve.outputs.pr != '' && steps.resolve.outputs.extlinks_run_id != ''
        continue-on-error: true # artifact may not exist (check skipped / expired)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-findings-ext-links
          run-id: ${{ steps.resolve.outputs.extlinks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ext-links-findings

      - name: Build and upsert comment
        if: steps.resolve.outputs.pr != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = Number(process.env.PR);
            const headSha = process.env.HEAD_SHA;

            // All content checks surfaced as sections in the one sticky comment.
            const CHECKS = [
              'Check Internal Links',
              'Check SEO Front Matter', 'Check Front Matter Properties',
              'Check Contributor IDs',
              'Check Reference Architecture IDs',
              'Check H1 Title',
              'Check drawio Files', 'Check Orphan Files', 'Check External Links',
              'Check Spelling', 'Check Typos',
            ];
            const MAX_BULLETS = 20;

            // Where to send a contributor to understand and resolve each check.
            // Points at the Automated Checks guide in the Community of Practice.
            const DOCS_BASE = 'https://architecture.learning.sap.com/docs/community/automated-checks';
            const DOCS = {
              'Check Internal Links': 'document-body/internal-links',
              'Check SEO Front Matter': 'front-matter/seo',
              'Check Front Matter Properties': 'front-matter/properties',
              'Check Contributor IDs': 'front-matter/contributor-ids',
              'Check Reference Architecture IDs': 'front-matter/reference-architecture-ids',
              'Check H1 Title': 'front-matter/h1-title',
              'Check drawio Files': 'document-body/drawio-files',
              'Check Orphan Files': 'document-body/orphan-files',
              'Check External Links': 'document-body/external-links',
              'Check Spelling': 'document-body/spelling',
              'Check Typos': 'document-body/typos',
            };

            // Neutralize untrusted text: HTML-escape and strip HTML-comment markers so
            // attacker-named files / messages can't break the sticky-comment structure.
            // Untrusted text (filenames, messages) is inserted into a Markdown comment.
            // esc() = HTML-escape + neutralize Markdown link/image/emphasis so a crafted
            // path can't inject links/images into the bot comment. escCode() = safe to
            // place inside an inline-code span (kill backtick / newline breakouts).
            const esc = (s) => String(s)
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/[`*_\[\]()~#|]/g, '\\$&')
              .replace(/\r?\n/g, ' ');
            const escCode = (s) => String(s).replace(/`/g, "'").replace(/\r?\n/g, ' ');

            // Latest check run per name for this commit.
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: headSha, per_page: 100,
            });
            const latest = {};
            for (const cr of runs) {
              if (!CHECKS.includes(cr.name)) continue;
              const prev = latest[cr.name];
              if (!prev || new Date(cr.started_at || 0) > new Date(prev.started_at || 0)) latest[cr.name] = cr;
            }

            const icon = (cr) => cr.status !== 'completed' ? '⏳'
              : (cr.conclusion === 'success' ? '✅' : (cr.conclusion === 'failure' ? '❌' : 'ℹ️'));

            const sections = [];
            let totalErrors = 0;
            for (const name of CHECKS) {
              const cr = latest[name];
              if (!cr) continue; // check didn't run (paths didn't match) — omit.
              if (cr.status === 'completed' && cr.conclusion !== 'success') totalErrors++;
              let body;

              if (name === 'Check External Links') {
                const p = 'ext-links-findings/out.md';
                if (cr.status !== 'completed') body = '⏳ Running…';
                else if (cr.conclusion === 'success') body = '✅ No broken external links.';
                else if (fs.existsSync(p)) {
                  // Untrusted (lychee) report: HTML-escape and wrap in <pre> so no
                  // Markdown/HTML construct in a crafted path or URL can alter the
                  // comment structure (safer than a ``` fence, which can be escaped).
                  const raw = fs.readFileSync(p, 'utf8').trim().slice(0, 3000)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                  body = '<pre>\n' + raw + '\n</pre>';
                  totalErrors++;
                } else body = `❌ Broken links found — see the [check run](${cr.html_url}).`;
              } else {
                const ann = await github.paginate(github.rest.checks.listAnnotations, {
                  owner: context.repo.owner, repo: context.repo.repo, check_run_id: cr.id, per_page: 100,
                });
                const errs = ann.filter(a => a.annotation_level === 'failure');
                if (!errs.length) {
                  body = cr.status !== 'completed' ? '⏳ Running…'
                    : (cr.conclusion === 'success' ? '✅ No issues.' : `${icon(cr)} ${esc(cr.conclusion || 'see check run')}. See the [check run](${cr.html_url}).`);
                } else {
                  totalErrors += errs.length;
                  const bullets = errs.slice(0, MAX_BULLETS).map(a => {
                    const loc = a.path + (a.start_line > 0 ? `:${a.start_line}` : '');
                    return `- \`${escCode(loc)}\` — ${esc(a.message)}`;
                  });
                  if (errs.length > MAX_BULLETS) bullets.push(`- …and ${errs.length - MAX_BULLETS} more`);
                  body = bullets.join('\n');
                }
              }
              // When the check is not clean, point the contributor at its guide so
              // they can understand and fix the finding.
              const slug = DOCS[name];
              const failing = cr.status === 'completed' && cr.conclusion !== 'success';
              const help = slug && failing ? `\n\n📖 [How to fix this](${DOCS_BASE}/${slug})` : '';
              // Don't prefix a passing check's heading with the green check — only
              // non-passing checks (failure / running / neutral) get an icon so
              // problems stand out. The body still states the clean result.
              const passed = cr.status === 'completed' && cr.conclusion === 'success';
              const headingPrefix = passed ? '' : `${icon(cr)} `;
              sections.push(`<!-- check:${name} -->\n### ${headingPrefix}${esc(name)}\n\n${body}${help}\n<!-- /check:${name} -->`);
            }

            const marker = '<!-- pr-check-summary -->';
            const header = `${marker}\n## 🔎 Content check results\n\n` +
              (sections.length
                ? (totalErrors ? `Found issues in the checks below. Each section links to how to fix it.` : `All content checks that ran are clean. ✅`)
                : `_No content checks ran for this PR._`) +
              `\n\n<sub>📖 New to these checks? See the [Automated Checks guide](${DOCS_BASE}) in the Community of Practice.</sub>`;
            const footer = `\n\n<sub>Updated ${new Date().toISOString()} for commit ${headSha.slice(0, 7)}. Fills in as checks finish.</sub>`;
            const commentBody = `${header}\n\n${sections.join('\n\n')}${footer}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body: commentBody,
              });
            }
