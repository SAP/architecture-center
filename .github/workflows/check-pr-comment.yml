name: PR Check Comment
# Aggregates the 8 content checks' findings into ONE sticky PR comment, grouped by
# check. Runs via workflow_run (base-repo context) so it can comment on fork PRs
# without exposing a writable token to PR code: it NEVER checks out PR content and
# only reads data (check-run annotations + one artifact). Rebuilds the whole comment
# on every trigger, so it is idempotent and safe against overlapping check completions.

on:
  workflow_run:
    workflows:
      - Check Typos
      - Check Spelling
      - Check Internal Links
      - Check SEO Front Matter
      - Check Reference Architecture IDs
      - Check drawio Files
      - Check Orphan Files
      - Check External Links
    types: [completed]

permissions: {}

concurrency:
  # Serialize per PR source so overlapping check completions don't corrupt the comment.
  group: pr-check-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      pull-requests: write
      actions: read
      contents: read
    steps:
      - name: Resolve PR and locate ext-links artifact
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;
            const headRepo = context.payload.workflow_run.head_repository.full_name;

            // Resolve the PR from the commit itself (trusted) — never trust artifact
            // contents for the PR number, to avoid cross-PR comment spoofing.
            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner: context.repo.owner, repo: context.repo.repo, commit_sha: headSha, per_page: 100 }
            );
            const match = prs.find(p =>
              p.state === 'open' &&
              p.head && p.head.sha === headSha &&
              p.head.ref === headBranch &&
              p.head.repo && p.head.repo.full_name === headRepo
            ) || prs.find(p => p.state === 'open');
            core.setOutput('pr', match ? String(match.number) : '');

            // Latest "Check External Links" run for this commit (its findings live in
            // an artifact, not annotations).
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              event: 'pull_request', head_sha: headSha, per_page: 100,
            });
            const ext = runs
              .filter(r => r.name === 'Check External Links')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            core.setOutput('extlinks_run_id', ext ? String(ext.id) : '');
            core.setOutput('head_sha', headSha);

      - name: Download ext-links findings
        if: steps.resolve.outputs.pr != '' && steps.resolve.outputs.extlinks_run_id != ''
        continue-on-error: true # artifact may not exist (check skipped / expired)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-findings-ext-links
          run-id: ${{ steps.resolve.outputs.extlinks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ext-links-findings

      - name: Build and upsert comment
        if: steps.resolve.outputs.pr != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = Number(process.env.PR);
            const headSha = process.env.HEAD_SHA;

            const CHECKS = [
              'Check Typos', 'Check Spelling', 'Check Internal Links',
              'Check SEO Front Matter', 'Check Reference Architecture IDs',
              'Check drawio Files', 'Check Orphan Files', 'Check External Links',
            ];
            const MAX_BULLETS = 20;

            // Neutralize untrusted text: HTML-escape and strip HTML-comment markers so
            // attacker-named files / messages can't break the sticky-comment structure.
            const esc = (s) => String(s)
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/<!--/g, '').replace(/--&gt;/g, '').replace(/-->/g, '');

            // Latest check run per name for this commit.
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: headSha, per_page: 100,
            });
            const latest = {};
            for (const cr of runs) {
              if (!CHECKS.includes(cr.name)) continue;
              const prev = latest[cr.name];
              if (!prev || new Date(cr.started_at || 0) > new Date(prev.started_at || 0)) latest[cr.name] = cr;
            }

            const icon = (cr) => cr.status !== 'completed' ? '⏳'
              : (cr.conclusion === 'success' ? '✅' : (cr.conclusion === 'failure' ? '❌' : 'ℹ️'));

            const sections = [];
            let totalErrors = 0;
            for (const name of CHECKS) {
              const cr = latest[name];
              if (!cr) continue; // check didn't run (paths didn't match) — omit.
              let body;

              if (name === 'Check External Links') {
                const p = 'ext-links-findings/out.md';
                if (cr.status !== 'completed') body = '⏳ Running…';
                else if (cr.conclusion === 'success') body = '✅ No broken external links.';
                else if (fs.existsSync(p)) {
                  const raw = fs.readFileSync(p, 'utf8').trim().replace(/`/g, "'").slice(0, 3000);
                  body = '```\n' + raw + '\n```';
                  totalErrors++;
                } else body = `❌ Broken links found — see the [check run](${cr.html_url}).`;
              } else {
                const ann = await github.paginate(github.rest.checks.listAnnotations, {
                  owner: context.repo.owner, repo: context.repo.repo, check_run_id: cr.id, per_page: 100,
                });
                const errs = ann.filter(a => a.annotation_level === 'failure');
                if (!errs.length) {
                  body = cr.status !== 'completed' ? '⏳ Running…'
                    : (cr.conclusion === 'success' ? '✅ No issues.' : `${icon(cr)} ${esc(cr.conclusion || 'see check run')}`);
                } else {
                  totalErrors += errs.length;
                  const bullets = errs.slice(0, MAX_BULLETS).map(a => {
                    const loc = a.path + (a.start_line > 0 ? `:${a.start_line}` : '');
                    return `- \`${esc(loc)}\` — ${esc(a.message)}`;
                  });
                  if (errs.length > MAX_BULLETS) bullets.push(`- …and ${errs.length - MAX_BULLETS} more`);
                  body = bullets.join('\n');
                }
              }
              sections.push(`<!-- check:${name} -->\n### ${icon(cr)} ${esc(name)}\n\n${body}\n<!-- /check:${name} -->`);
            }

            const marker = '<!-- pr-check-summary -->';
            const header = `${marker}\n## 🔎 Content check results\n\n` +
              (sections.length
                ? (totalErrors ? `Found issues in the checks below — details grouped by check.` : `All content checks that ran are clean. ✅`)
                : `_No content checks ran for this PR._`);
            const footer = `\n\n<sub>Updated ${new Date().toISOString()} for commit ${headSha.slice(0, 7)}. Fills in as checks finish.</sub>`;
            const commentBody = `${header}\n\n${sections.join('\n\n')}${footer}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body: commentBody,
              });
            }
