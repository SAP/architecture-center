name: Check External Links
# Archetype: CHANGED-FILES — only changed Markdown files are checked for broken links (needs fetch-depth: 0).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'news/**/*.md'
      - 'news/**/*.mdx'
      - '.github/workflows/check-ext-links.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ext-links:
    name: Check External Links
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed to diff changed Markdown against the PR base

      - name: Compute scope
        id: scope
        shell: bash
        run: |
          # Changed-files scope: only Markdown added/modified vs the PR base.
          git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD" -- docs news \
            | grep -E '\.(md|mdx)$' > "$RUNNER_TEMP/changed.txt" || true
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            {
              echo "### External links check"
              echo ""
              echo "✅ No changed Markdown under docs/ or news/ — nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "✅ No changed Markdown under docs/ or news/ — nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # Space-separated file list for lychee positional args.
          echo "files=$(tr '\n' ' ' < "$RUNNER_TEMP/changed.txt" | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - name: Install lychee
        if: steps.scope.outputs.skip != 'true'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: lychee@0.14.3

      - name: Check external links
        id: lychee
        if: steps.scope.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t FILES < "$RUNNER_TEMP/changed.txt"
          rc=0
          # --format github emits ::error annotations to stdout; sed injects title=.
          lychee --cache-exclude-status '403,429,500..502' --no-progress --format github \
            "${FILES[@]}" \
            | sed 's/^::error \([^:]*\)::/::error \1,title=External links::/' \
            | tee "$RUNNER_TEMP/lychee.txt" || rc=$?
          if [ "$rc" -ne 0 ]; then
            {
              echo "### External links check"
              echo ""
              echo "❌ Broken links found (also shown inline on the Files tab):"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/lychee.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### External links check"
              echo ""
              echo "✅ All external links are valid."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
