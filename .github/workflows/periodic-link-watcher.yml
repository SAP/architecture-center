name: Periodic Link Checker

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

permissions: {}

jobs:
    link-checker:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: write
            issues: write
        steps:
            - name: Checkout source code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Link Checker
              id: lychee
              uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6 # v2.3.0
              with:
                  args: --cache-exclude-status '403, 429, 500..502' --verbose --no-progress 'docs/**/*.md' 'blog/**/*.md'
                  output: ./lychee/out.md
                  fail: false
              env:
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
            - name: Find existing issue
              id: find_issue
              uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2
              if: failure()
              with:
                  state: open
                  labels: |
                      broken link
                      automated issue
            - name: Create or update issue for broken links
              id: create_issue
              uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
              if: failure()
              with:
                  title: Link Checker Report
                  # If issue number is empty a new issue gets created
                  issue-number: ${{ steps.find_issue.outputs.issue-number }}
                  content-filepath: ./lychee/out.md
                  labels: broken link, automated issue
