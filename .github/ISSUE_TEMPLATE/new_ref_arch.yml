name: 💡Request for a new SAP Reference Architecture
description: Suggest an idea for this project
title: "[NEW_RA]"
labels: [reference-architecture, content]
body:
  - type: dropdown
    attributes:
      label: Do you want an internal or external reference architecture which will be published at https://github.com/SAP/architecture-center/?
      description: Specify the main area that you want to see improved.
      options:
        - internal
        - external
    validations:
      required: true
  - type: textarea
    id: area
    attributes:
      label: Describe this new reference architecture, so precisely as possible.
      description: Provide a clear and concise description of the new reference architecture and the main purpose of it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: If known provide the responsible contact person for this new reference architecture.
      description: E-Mail address or SAP user id 
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Events
      description: Assign this reference architecture to a project event if applicable.
      options:
        - no Event
        - TechEd 2026
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Add any other context like links or references about this new reference architecture here. Anything that will give us more context about this new request!

        Tip: You can attach images or files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false